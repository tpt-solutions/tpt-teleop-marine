name: lint

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  nightly-clippy:
    # Nightly fmt + clippy for the excluded SIMD crates.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [tpt-t-marine-nav, tpt-t-marine-sonar]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt (${{ matrix.crate }})
        run: cargo fmt --manifest-path crates/${{ matrix.crate }}/Cargo.toml -- --check
      - name: clippy (${{ matrix.crate }})
        run: cargo clippy --manifest-path crates/${{ matrix.crate }}/Cargo.toml --all-targets -- -D warnings

  audits:
    # Zero-lock (hard gate) + allocation report (informational).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Lock-free hot-path audit
        run: bash tools/lock-audit.sh
      - name: Allocation audit (report)
        run: bash tools/alloc-audit.sh

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
