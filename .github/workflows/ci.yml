name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (workspace)
        run: cargo build --workspace --all-targets
      - name: Test (workspace)
        run: cargo test --workspace

  cross-check:
    # Compile-check every cfg-gated backend (libc / windows-sys thread
    # pinning) regardless of host OS.
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check (${{ matrix.target }})
        run: cargo check --workspace --all-targets --target ${{ matrix.target }}

  nav-nightly:
    # Phase 3 crate `tpt-t-marine-nav` is excluded from the stable workspace
    # and built in isolation on nightly (portable_simd). Rest of the
    # workspace stays on stable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build (tpt-t-marine-nav, nightly)
        run: cargo build --manifest-path crates/tpt-t-marine-nav/Cargo.toml --all-targets
      - name: Test (tpt-t-marine-nav, nightly)
        run: cargo test --manifest-path crates/tpt-t-marine-nav/Cargo.toml

  sonar-nightly:
    # Phase 6 crate `tpt-t-marine-sonar` is excluded from the stable workspace
    # and built in isolation on nightly (portable_simd). Rest of the
    # workspace stays on stable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build (tpt-t-marine-sonar, nightly)
        run: cargo build --manifest-path crates/tpt-t-marine-sonar/Cargo.toml --all-targets
      - name: Test (tpt-t-marine-sonar, nightly)
        run: cargo test --manifest-path crates/tpt-t-marine-sonar/Cargo.toml

  visualizer:
    # Phase 13 visualizer builds in isolation (egui chain is outside the
    # workspace MIT-chain deny scope; see root Cargo.toml `exclude`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (tpt-t-marine-visualizer)
        run: cargo build --manifest-path crates/tpt-t-marine-visualizer/Cargo.toml
