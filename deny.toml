[bans]
multiple-versions = "warn"
# The workspace's own crates interconnect via path deps (no version) —
# that is the co-development story, not bloat; third-party wildcard
# requirements stay banned in review.
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
version = 2
yanked = "warn"
