# cargo-deny configuration — the "MIT Chain" policy (spec §2)
#
# tpt-teleop-marine keeps its dependency tree free of Apache-only patent
# liabilities, mirroring the sister `tpt-teleop` repo:
#   * Allowed: MIT, BSD-2/3-Clause, ISC, Zlib, MPL-2.0 (and Unicode font/data
#     licenses for embedded Unicode tables, which are BSD-style permissive).
#   * Dual MIT OR Apache-2.0 crates are permitted, but cargo resolves and
#     compiles them strictly under MIT via the [[licenses.clarify]] overrides
#     below. New dual-licensed transitive deps MUST be added here.
#   * Strictly Apache-2.0-only crates are banned outright.
#
# Spec §7 additionally bans by *function* (enforced in review + the Phase 14
# audit): nalgebra, OpenCV/pcl, tokio/crossbeam, geo/proj, serde/bincode and
# the `nmea` crate must never enter the tree — the custom zero-allocation
# choices replace them.

[graph]
all-features = true
# Check every CI target from one invocation so platform-gated deps
# (windows-sys, libc) are always audited.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    # BSD-style permissive licenses used solely for embedded Unicode tables
    "Unicode-DFS-2016",
    "Unicode-3.0",
]
# With a non-empty `allow` list, every other license (including Apache-2.0-
# only crates) is rejected automatically — that is the MIT-chain ban.
confidence-threshold = 0.93

# --- Force-MIT resolution for dual MIT OR Apache-2.0 crates -----------------
# Each entry pins the crate to its MIT branch so the Apache-2.0 grant is
# never relied upon. Keep alphabetized; extend when new deps appear.

[[licenses.clarify]]
name = "libc"
expression = "MIT"
license-files = []


[[licenses.clarify]]
name = "rkyv"
expression = "MIT"
license-files = []


