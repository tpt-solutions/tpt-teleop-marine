[package]
name = "tpt-t-marine-sonar"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-teleop-marine"
description = "Multibeam, sidescan, and forward-looking sonar processing for tpt-teleop-marine: slab-allocated ring buffers, SIMD sound-velocity correction and ray tracing (nightly-only)"

[dependencies]
tpt-t-marine-core = { path = "../tpt-t-marine-core" }

[[bench]]
name = "ping"
harness = false

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
